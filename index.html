<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<title>Ledger – private spending tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.1/tesseract.min.js"></script>
<style>
:root{--bg:#eef0f4;--card:#fff;--tx:#14171f;--mut:#6b7280;--ac:#2f4bd8;--bd:#dde1e9;--neg:#14171f;--pos:#15803d;--warn:#b45309;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e1014;--card:#171a21;--tx:#eceef3;--mut:#9099a8;--ac:#7b93ff;--bd:#2a2f3a;--neg:#eceef3;--pos:#4ade80;--warn:#fbbf24}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 ui-sans-serif,-apple-system,system-ui,sans-serif;padding-bottom:80px}
main{max-width:720px;margin:0 auto;padding:12px}
h1{font:600 26px ui-serif,Georgia,serif;margin:8px 0 12px}
h3{font:600 15px ui-serif,Georgia,serif;margin:18px 0 6px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;border:0;background:none;color:var(--mut);font:600 14px inherit}
nav button.on{color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat small{color:var(--mut);display:block}.stat b{font:600 22px ui-serif,Georgia,serif}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters .w{grid-column:1/3}
input,select,button.b{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:9px;width:100%}
button.b{width:auto;cursor:pointer;margin:4px 6px 4px 0}button.p{background:var(--ac);color:#fff;border-color:var(--ac)}
.bar{position:relative;display:flex;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:8px;margin:3px 0;overflow:hidden;cursor:pointer;border:1px solid transparent}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ac);opacity:.16}
.bar span,.bar b{position:relative;font-weight:500}.bar.on{border-color:var(--ac)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid var(--bd);cursor:pointer}
.row small{color:var(--mut)}.row .d{min-width:0;overflow:hidden;text-overflow:ellipsis}
.amt{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}.pos{color:var(--pos)}.flag{color:var(--warn)}
.chip{display:inline-block;padding:2px 8px;border:1px solid var(--bd);border-radius:99px;margin:2px 4px 2px 0;font-size:13px}
#modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:9}
#modal.show{display:flex}.sheet{background:var(--card);width:100%;max-width:720px;border-radius:16px 16px 0 0;padding:16px;max-height:90vh;overflow:auto}
.sheet label{display:block;margin:8px 0 2px;color:var(--mut);font-size:13px}
.hint{color:var(--mut);font-size:13px}
</style></head><body>
<main id="app"></main>
<div id="modal"></div>
<nav><button data-v="dash">Overview</button><button data-v="tx">Transactions</button><button data-v="imp">Import</button></nav>
<script>
const $=s=>document.querySelector(s);
let TX=[],RULES={},F={q:'',cat:'',month:'',type:'',min:0,max:0},view='dash';
const CATS=[['Groceries',/carrefour|spinneys|lulu|waitrose|union ?coop|grocer|supermarket|choithram|farm/i],
['Dining',/restaurant|cafe|coffee|starbucks|mcdonald|kfc|talabat|deliveroo|zomato|pizza|burger|bakery|shawarma/i],
['Transport',/careem|uber|\brta\b|salik|\bnol\b|taxi|enoc|adnoc|eppco|petrol|parking|fuel|metro/i],
['Shopping',/amazon|\bnoon\b|namshi|ikea|mall|h&m|zara|shein|apple store|\bmax\b/i],
['Bills & utilities',/dewa|etisalat|\bdu\b|e&|telecom|internet|sewa|empower|\brent\b|insurance|chiller/i],
['Subscriptions',/netflix|spotify|apple\.com|google|youtube|openai|anthropic|icloud|subscription|prime/i],
['Health',/pharmacy|clinic|hospital|medical|aster|dental|optic/i],
['Travel',/emirates|etihad|flydubai|airline|airways|hotel|booking\.com|airbnb|air arabia/i],
['Cash',/\batm\b|cash w/i],['Fees & interest',/\bfee|charge|\bvat\b|interest|commission/i],
['Transfers',/transfer|\bipi\b|iban|wps|remit/i]];
const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
const fmt=n=>n.toLocaleString('en',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hash=s=>{let h=5381,g=7;for(let i=0;i<s.length;i++){h=(h*33^s.charCodeAt(i))>>>0;g=(g*31+s.charCodeAt(i))>>>0}return h.toString(36)+g.toString(36)};
const mkey=d=>d.toLowerCase().replace(/[^a-z& ]/g,' ').split(/\s+/).filter(Boolean).slice(0,3).join(' ')||'unknown';
function cat(t){const k=mkey(t.desc);if(RULES[k])return RULES[k];for(const[c,re]of CATS)if(re.test(t.desc))return c;return t.amt>0?'Income':'Other'}
// storage
const dbp=new Promise((res,rej)=>{const r=indexedDB.open('ledger',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
async function kv(w,k,v){const db=await dbp;return new Promise((res,rej)=>{const s=db.transaction('kv',w?'readwrite':'readonly').objectStore('kv');const q=w?s.put(v,k):s.get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
const save=()=>kv(1,'data',{TX,RULES}).catch(()=>alert('Could not save to device storage.'));
// parsing
function pd(l){let m=l.match(/^\s*(\d{4})-(\d{2})-(\d{2})\s*/);if(m)return[`${m[1]}-${m[2]}-${m[3]}`,l.slice(m[0].length)];
m=l.match(/^\s*(\d{1,2})[\/\-. ](\d{1,2}|[A-Za-z]{3,9})[\/\-. ,]+(\d{2,4})\s*/);if(!m)return null;
const d=+m[1],mo=isNaN(m[2])?MON[m[2].slice(0,3).toLowerCase()]:+m[2];let y=+m[3];
if(!mo||mo>12||d>31||d<1)return null;if(y<100)y+=2000;
return[`${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`,l.slice(m[0].length)]}
const AM=/(\d{1,3}(?:,\d{3})+|\d+)\.\d{2}(?:\s?(CR|DR)\b)?/gi;
function parse(lines){const out=[];let prev=null;
for(const raw of lines){const l=raw.replace(/\s+/g,' ').trim();if(!l)continue;const p=pd(l);
if(p){let r=p[1];const p2=pd(r);if(p2)r=p2[1];const am=[...r.matchAll(AM)];if(!am.length){prev=null;continue}
const nums=am.map(a=>parseFloat(a[0].replace(/,/g,'').replace(/\s?(CR|DR)$/i,'')));
const two=am.length>=2,ai=two?am.length-2:0;
prev={date:p[0],desc:r.replace(AM,'').replace(/\s+/g,' ').trim(),amt:nums[ai],bal:two?nums[nums.length-1]:null,sfx:(am[ai][2]||'').toUpperCase()};out.push(prev)}
else if(prev&&!/^(page|balance|total|opening|closing|statement)/i.test(l)&&!/\d\.\d{2}/.test(l)&&prev.desc.length<160)prev.desc+=' '+l}
return typeIt(out)}
const near=(a,b)=>Math.abs(a-b)<.015;
function typeIt(rows){rows.forEach((r,i)=>{r.t=null;r.ok=false;const p=rows[i-1],n=rows[i+1];
if(r.bal!=null){for(const o of[p,n]){if(r.t||!o||o.bal==null)continue;
if(near(o.bal+r.amt,r.bal)){r.t='c';r.ok=true}else if(near(o.bal-r.amt,r.bal)){r.t='d';r.ok=true}}}
if(!r.t){if(r.sfx){r.t=r.sfx=='CR'?'c':'d';r.ok=true}else{r.t=/salary|deposit|refund|cashback|reversal|received|credit/i.test(r.desc)?'c':'d'}}});return rows}
// reading
const group=items=>{const rows=[];items.filter(i=>i.str.trim()).sort((a,b)=>b.transform[5]-a.transform[5]||a.transform[4]-b.transform[4]).forEach(i=>{const y=i.transform[5];let r=rows.find(r=>Math.abs(r.y-y)<3);if(!r){r={y,it:[]};rows.push(r)}r.it.push(i)});
return rows.map(r=>r.it.sort((a,b)=>a.transform[4]-b.transform[4]).map(i=>i.str).join(' '))};
let OCR;const ocr=()=>OCR||(OCR=Tesseract.createWorker('eng'));
async function readPdf(file,log){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;const lines=[];
for(let i=1;i<=pdf.numPages;i++){log(`${file.name}: page ${i} of ${pdf.numPages}`);const pg=await pdf.getPage(i);
let pl=group((await pg.getTextContent()).items);
if(pl.join('').replace(/\s/g,'').length<40){log(`${file.name}: reading scanned page ${i} of ${pdf.numPages}…`);
const vp=pg.getViewport({scale:2}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
pl=(await(await ocr()).recognize(c)).data.text.split('\n');c.width=c.height=0}
lines.push(...pl)}return lines}
async function doImport(files){const log=$('#log'),L=m=>log.textContent=m;let add=0,dup=0,none=0;const seen=new Set(TX.map(t=>t.id));
for(const f of files){try{const rows=parse(await readPdf(f,L));if(!rows.length)none++;const cnt={};
for(const r of rows){const base=[r.date,r.amt,r.bal,r.desc.toLowerCase()].join('|');cnt[base]=(cnt[base]||0)+1;const id=hash(base+'#'+cnt[base]);
if(seen.has(id)){dup++;continue}seen.add(id);
const t={id,date:r.date,desc:r.desc,amt:r.t=='c'?r.amt:-r.amt,bal:r.bal,src:f.name,flag:!r.ok,tags:'',note:''};t.cat=cat(t);TX.push(t);add++}}
catch(e){L('Could not read '+f.name+': '+e.message);return}}
await save();L(`Added ${add} transactions, skipped ${dup} duplicates${none?`, found no rows in ${none} file(s)`:''}. Review rows marked ⚠ in Transactions.`);render()}
// views
function filt(){const q=F.q.toLowerCase();return TX.filter(t=>(!q||(t.desc+' '+t.tags+' '+t.note+' '+t.cat).toLowerCase().includes(q))&&(!F.cat||t.cat==F.cat)&&(!F.month||t.date.startsWith(F.month))&&
(!F.type||(F.type=='s'&&t.amt<0)||(F.type=='i'&&t.amt>0)||(F.type=='f'&&t.flag))&&(!F.min||Math.abs(t.amt)>=F.min)&&(!F.max||Math.abs(t.amt)<=F.max)).sort((a,b)=>b.date.localeCompare(a.date))}
function bars(title,map,a,sel,byKey){let e=Object.entries(map);e=byKey?e.sort((x,y)=>x[0].localeCompare(y[0])).slice(-12):e.sort((x,y)=>y[1]-x[1]).slice(0,12);const mx=Math.max(...e.map(x=>x[1]),1);
return`<h3>${title}</h3>`+(e.map(([k,v])=>`<div class="bar ${sel===k?'on':''}" data-a="${a}" data-k="${esc(k)}"><i style="width:${v/mx*100}%"></i><span>${esc(k)}</span><b>${fmt(v)}</b></div>`).join('')||'<p class="hint">Nothing yet.</p>')}
function filterUI(){const ms=[...new Set(TX.map(t=>t.date.slice(0,7)))].sort().reverse(),cs=[...new Set([...CATS.map(c=>c[0]),'Income','Other',...TX.map(t=>t.cat)])].sort();
return`<div class="filters"><input class="w" id="q" placeholder="Search description, tag, note" value="${esc(F.q)}">
<select id="fm"><option value="">All months</option>${ms.map(m=>`<option ${F.month==m?'selected':''}>${m}</option>`).join('')}</select>
<select id="fc"><option value="">All categories</option>${cs.map(c=>`<option ${F.cat==c?'selected':''}>${esc(c)}</option>`).join('')}</select>
<select id="ft"><option value="">Spending and income</option><option value="s" ${F.type=='s'?'selected':''}>Spending only</option><option value="i" ${F.type=='i'?'selected':''}>Income only</option><option value="f" ${F.type=='f'?'selected':''}>Needs check ⚠</option></select>
<span style="display:flex;gap:6px"><input id="mn" type="number" placeholder="Min" value="${F.min||''}"><input id="mx" type="number" placeholder="Max" value="${F.max||''}"></span></div>`}
function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==view));const A=$('#app');
if(view=='imp'){A.innerHTML=`<h1>Import</h1><div class="card"><b>Add bank statements (PDF)</b><p class="hint">Text PDFs are read directly. Scanned pages are read with OCR on this phone. Choose as many files as you like; overlapping statements are de-duplicated.</p>
<input type="file" id="pf" accept="application/pdf" multiple><p id="log" class="hint">${TX.length} transactions stored.</p></div>
<div class="card"><b>Your data</b><p class="hint">Everything lives in this browser on your device. Back up now and then.</p>
<button class="b" id="ex">Export CSV</button><button class="b" id="bk">Backup (JSON)</button><label class="b" style="display:inline-block">Restore<input type="file" id="rs" accept=".json" hidden></label><button class="b" id="er">Erase everything</button></div>`;
$('#pf').onchange=e=>doImport([...e.target.files]);$('#ex').onclick=exportCsv;$('#bk').onclick=()=>dl('ledger-backup.json',JSON.stringify({TX,RULES}),'application/json');
$('#rs').onchange=async e=>{try{const d=JSON.parse(await e.target.files[0].text());TX=d.TX;RULES=d.RULES||{};await save();render()}catch{alert('That file is not a Ledger backup.')}};
$('#er').onclick=async()=>{if(confirm('Delete all transactions and rules from this device?')){TX=[];RULES={};await save();render()}};return}
A.innerHTML=`<h1>${view=='dash'?'Overview':'Transactions'}</h1><div class="card">${filterUI()}</div><div id="main"></div>`;
$('#q').oninput=e=>{F.q=e.target.value;main()};$('#fm').onchange=e=>{F.month=e.target.value;main()};$('#fc').onchange=e=>{F.cat=e.target.value;main()};$('#ft').onchange=e=>{F.type=e.target.value;main()};
$('#mn').oninput=e=>{F.min=+e.target.value;main()};$('#mx').oninput=e=>{F.max=+e.target.value;main()};main()}
function main(){const L=filt(),sp=L.filter(t=>t.amt<0),inc=L.filter(t=>t.amt>0),S=sp.reduce((a,t)=>a-t.amt,0),I=inc.reduce((a,t)=>a+t.amt,0);let h='';
if(!TX.length){$('#main').innerHTML='<div class="card"><b>No transactions yet.</b><p class="hint">Open Import and add your first statement.</p></div>';return}
if(view=='dash'){const by=(f,k)=>{const m={};sp.forEach(t=>m[k(t)]=(m[k(t)]||0)-t.amt);return m};
h=`<div class="stats card"><div class="stat"><small>Spent</small><b>${fmt(S)}</b></div><div class="stat"><small>Income</small><b class="pos">${fmt(I)}</b></div><div class="stat"><small>Net</small><b>${fmt(I-S)}</b></div><div class="stat"><small>Transactions</small><b>${L.length}</b></div></div>
<div class="card">${bars('Spending by month',by(0,t=>t.date.slice(0,7)),'m',F.month,1)}${bars('Spending by category',by(0,t=>t.cat),'c',F.cat)}${bars('Top merchants',by(0,t=>mkey(t.desc)),'s','')}</div><p class="hint">Tap a bar to filter. Tapping a merchant opens its transactions.</p>`}
else{h=`<p class="hint">${L.length} shown · spent ${fmt(S)} · income ${fmt(I)}</p><div class="card" style="padding:4px 12px">`+(L.slice(0,300).map(t=>`<div class="row" data-id="${t.id}"><div class="d"><div>${t.flag?'<span class="flag">⚠ </span>':''}${esc(t.desc)||'(no description)'}</div><small>${t.date} · ${esc(t.cat)}${t.tags?' · '+esc(t.tags):''}</small></div><div class="amt ${t.amt>0?'pos':''}">${fmt(t.amt)}${t.bal!=null?`<br><small>bal ${fmt(t.bal)}</small>`:''}</div></div>`).join('')||'<p class="hint">No matches.</p>')+'</div>'+(L.length>300?'<p class="hint">Showing the latest 300. Narrow the filters to see more.</p>':'')}
$('#main').innerHTML=h}
$('#app').onclick=e=>{const b=e.target.closest('.bar'),r=e.target.closest('.row');
if(b){const k=b.dataset.k,a=b.dataset.a;if(a=='m')F.month=F.month==k?'':k;if(a=='c')F.cat=F.cat==k?'':k;if(a=='s'){F.q=k;view='tx'}render()}
if(r)edit(r.dataset.id)};
document.querySelector('nav').onclick=e=>{if(e.target.dataset.v){view=e.target.dataset.v;render()}};
function edit(id){const t=TX.find(x=>x.id==id),cs=[...new Set([...CATS.map(c=>c[0]),'Income','Other',...TX.map(x=>x.cat)])].sort(),M=$('#modal');
M.innerHTML=`<div class="sheet"><b>Edit transaction</b><p class="hint">${esc(t.src)}${t.flag?' · ⚠ type or amount could not be verified against the balance':''}</p>
<label>Date</label><input id="e1" type="date" value="${t.date}"><label>Description</label><input id="e2" value="${esc(t.desc)}">
<label>Amount (negative = spending)</label><input id="e3" type="number" step="0.01" value="${t.amt}"><label>Category</label><input id="e4" list="cl" value="${esc(t.cat)}"><datalist id="cl">${cs.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
<label>Tags (comma separated)</label><input id="e5" value="${esc(t.tags)}"><label>Note</label><input id="e6" value="${esc(t.note)}">
<label><input type="checkbox" id="e7" checked style="width:auto"> Use this category for every “${esc(mkey(t.desc))}” transaction</label>
<p><button class="b p" id="s1">Save</button><button class="b" id="s2">Cancel</button><button class="b" id="s3">Delete</button></p></div>`;M.classList.add('show');
$('#s2').onclick=()=>M.classList.remove('show');
$('#s3').onclick=async()=>{TX=TX.filter(x=>x.id!=id);await save();M.classList.remove('show');render()};
$('#s1').onclick=async()=>{t.date=$('#e1').value||t.date;t.desc=$('#e2').value;t.amt=parseFloat($('#e3').value)||t.amt;t.tags=$('#e5').value;t.note=$('#e6').value;t.flag=false;const c=$('#e4').value.trim()||'Other';
if($('#e7').checked){const k=mkey(t.desc);RULES[k]=c;TX.forEach(x=>{if(mkey(x.desc)==k)x.cat=c})}else t.cat=c;await save();M.classList.remove('show');render()}}
function dl(n,s,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type}));a.download=n;a.click()}
function exportCsv(){const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;dl('transactions.csv',['Date,Description,Amount,Balance,Category,Tags,Note,Source'].concat(TX.sort((a,b)=>a.date.localeCompare(b.date)).map(t=>[t.date,t.desc,t.amt,t.bal??'',t.cat,t.tags,t.note,t.src].map(q).join(','))).join('\n'),'text/csv')}
(async()=>{try{const d=await kv(0,'data');if(d){TX=d.TX||[];RULES=d.RULES||{}}}catch{}render()})();
</script></body></html>
